[pytest]
# Markers registered so they are not "unknown marker" warnings.
#
# The needs_* tier declares an AMBIENT dependency -- something outside this repo that the test
# cannot create for itself. It exists so that "the suite is green" means one thing rather than
# depending on what happened to be running. Before it, 26% of the test files needed the live
# worker, ComfyUI or the internet, and a run could fail purely because ComfyUI was down.
#
# You do not have to remember to apply needs_worker: conftest derives it from the fixtures a test
# requests. And you cannot successfully forget the others -- conftest blocks outbound connections
# for any test that declares none of these, so an undeclared dependency FAILS instead of passing
# whenever the service happens to be up. See _forbid_undeclared_ambient_dependencies.
markers =
    smoke: milestone-only real-render end-to-end tests (Tier 2). Require a real checkpoint on disk + a live ComfyUI on 127.0.0.1:8188. Skip cleanly when unavailable. Run explicitly with `pytest -m smoke`.
    contract: worker protocol / state-machine contract tests.
    needs_worker: spawns or talks to a live worker_service. Applied automatically to anything using the worker_service / worker_client fixtures.
    needs_comfy: talks to a live ComfyUI (127.0.0.1:8188 by default).
    needs_network: reaches the public internet (Civitai, Hugging Face).
    needs_gpu: requires CUDA and a real GPU.

# Default runs (`pytest`, `pytest tests/`) EXCLUDE the smoke tier: Tier 2 is a
# milestone gate, not a per-pass gate. A command-line `-m smoke` overrides this
# (the later -m wins), so `pytest -m smoke` collects ONLY the smoke tier.
#
# --strict-markers so a typo in a marker name is an error rather than a test that
# quietly belongs to no tier.
addopts = -m "not smoke" --strict-markers
