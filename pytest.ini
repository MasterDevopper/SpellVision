[pytest]
# Markers registered so they are not "unknown marker" warnings.
markers =
    smoke: milestone-only real-render end-to-end tests (Tier 2). Require a real checkpoint on disk + a live ComfyUI on 127.0.0.1:8188. Skip cleanly when unavailable. Run explicitly with `pytest -m smoke`.
    contract: worker protocol / state-machine contract tests.

# Default runs (`pytest`, `pytest tests/`) EXCLUDE the smoke tier: Tier 2 is a
# milestone gate, not a per-pass gate. A command-line `-m smoke` overrides this
# (the later -m wins), so `pytest -m smoke` collects ONLY the smoke tier.
addopts = -m "not smoke"
